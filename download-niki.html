  <!-- Internal JavaScript (Automatic Smooth Text Carousel) -->
  <script>
    (function () {
      'use strict';

      const slides = document.querySelectorAll('.carousel-text-slide');
      let currentIndex = 0;
      let timer = null;

      function nextSlide() {
        if (!slides.length) return;
        slides[currentIndex].classList.remove('is-active');
        currentIndex = (currentIndex + 1) % slides.length;
        slides[currentIndex].classList.add('is-active');
      }

      function startAutoPlay() {
        stopAutoPlay();
        timer = setInterval(nextSlide, 2600);
      }

      function stopAutoPlay() {
        if (timer) {
          clearInterval(timer);
          timer = null;
        }
      }

      const carouselContainer = document.getElementById('text-carousel');
      if (carouselContainer) {
        carouselContainer.addEventListener('mouseenter', stopAutoPlay);
        carouselContainer.addEventListener('mouseleave', startAutoPlay);
      }

      startAutoPlay();
    })();
  </script>
</body>
