  <!-- Internal JavaScript (Text Carousel & Phone Screenshot Carousel) -->
  <script>
    (function () {
      'use strict';

      /* --- 1. Top Text Carousel Logic --- */
      const textSlides = document.querySelectorAll('.carousel-text-slide');
      let textIndex = 0;
      let textTimer = null;

      function nextTextSlide() {
        if (!textSlides.length) return;
        textSlides[textIndex].classList.remove('is-active');
        textIndex = (textIndex + 1) % textSlides.length;
        textSlides[textIndex].classList.add('is-active');
      }

      function startTextAutoPlay() {
        stopTextAutoPlay();
        textTimer = setInterval(nextTextSlide, 2600);
      }

      function stopTextAutoPlay() {
        if (textTimer) {
          clearInterval(textTimer);
          textTimer = null;
        }
      }

      const textContainer = document.getElementById('text-carousel');
      if (textContainer) {
        textContainer.addEventListener('mouseenter', stopTextAutoPlay);
        textContainer.addEventListener('mouseleave', startTextAutoPlay);
      }
      startTextAutoPlay();

      /* --- 2. Phone Screenshots Carousel Logic --- */
      const track = document.getElementById('phone-carousel-track');
      const prevBtn = document.getElementById('carousel-prev-btn');
      const nextBtn = document.getElementById('carousel-next-btn');
      const dots = document.querySelectorAll('#phone-carousel-dots .carousel-dot');
      const showcaseArea = document.getElementById('phone-showcase');
      const totalSlides = 5;
      let currentSlide = 0;
      let phoneTimer = null;

      function updatePhoneSlide(index) {
        currentSlide = (index + totalSlides) % totalSlides;
        if (track) {
          track.style.transform = 'translateX(-' + (currentSlide * 100) + '%)';
        }
        dots.forEach(function (dot, i) {
          if (i === currentSlide) {
            dot.classList.add('is-active');
            dot.setAttribute('aria-selected', 'true');
          } else {
            dot.classList.remove('is-active');
            dot.setAttribute('aria-selected', 'false');
          }
        });
      }

      function nextPhoneSlide() {
        updatePhoneSlide(currentSlide + 1);
      }

      function prevPhoneSlide() {
        updatePhoneSlide(currentSlide - 1);
      }

      function startPhoneAutoPlay() {
        stopPhoneAutoPlay();
        phoneTimer = setInterval(nextPhoneSlide, 3400);
      }

      function stopPhoneAutoPlay() {
        if (phoneTimer) {
          clearInterval(phoneTimer);
          phoneTimer = null;
        }
      }

      if (prevBtn) {
        prevBtn.addEventListener('click', function () {
          prevPhoneSlide();
          startPhoneAutoPlay();
        });
      }

      if (nextBtn) {
        nextBtn.addEventListener('click', function () {
          nextPhoneSlide();
          startPhoneAutoPlay();
        });
      }

      dots.forEach(function (dot) {
        dot.addEventListener('click', function () {
          const targetIndex = parseInt(dot.getAttribute('data-dot-index'), 10);
          if (!isNaN(targetIndex)) {
            updatePhoneSlide(targetIndex);
            startPhoneAutoPlay();
          }
        });
      });

      if (showcaseArea) {
        showcaseArea.addEventListener('mouseenter', stopPhoneAutoPlay);
        showcaseArea.addEventListener('mouseleave', startPhoneAutoPlay);
      }

      /* Touch Swipe Gesture Support for Mobile Devices */
      if (track) {
        let touchStartX = 0;
        let touchEndX = 0;

        track.addEventListener('touchstart', function (e) {
          touchStartX = e.changedTouches[0].screenX;
          stopPhoneAutoPlay();
        }, { passive: true });

        track.addEventListener('touchend', function (e) {
          touchEndX = e.changedTouches[0].screenX;
          const diffX = touchEndX - touchStartX;
          if (Math.abs(diffX) > 40) {
            if (diffX < 0) {
              nextPhoneSlide();
            } else {
              prevPhoneSlide();
            }
          }
          startPhoneAutoPlay();
        }, { passive: true });
      }

      startPhoneAutoPlay();
    })();
  </script>
